<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="stockGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#stockBg)" />
  
  <g transform="translate(200, 150)">
    <path d="M -150 0 Q -100 -40 -50 -20 T 0 0 T 50 20 T 100 -10 T 150 0" 
          fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5">
      <animate attributeName="d" 
               values="M -150 0 Q -100 -40 -50 -20 T 0 0 T 50 20 T 100 -10 T 150 0;
                       M -150 -20 Q -100 -60 -50 -40 T 0 -20 T 50 0 T 100 -30 T 150 -20;
                       M -150 0 Q -100 -40 -50 -20 T 0 0 T 50 20 T 100 -10 T 150 0" 
               dur="3s" repeatCount="indefinite"/>
    </path>
    
    <circle r="4" fill="#4ade80" filter="url(#stockGlow)">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M -150 0 Q -100 -40 -50 -20 T 0 0 T 50 20 T 100 -10 T 150 0"/>
    </circle>
    
    <rect x="-80" y="-80" width="160" height="120" fill="none" stroke="#334155" stroke-width="1" rx="4"/>
    
    <line x1="-60" y1="-40" x2="60" y2="-40" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
    <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
    <line x1="-60" y1="20" x2="60" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
    
    <rect x="-55" y="-50" width="40" height="8" fill="#4ade80" rx="2">
      <animate attributeName="width" values="40;60;40;30;40" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-55" y="-20" width="50" height="8" fill="#fbbf24" rx="2">
      <animate attributeName="width" values="50;30;50;60;50" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-55" y="10" width="35" height="8" fill="#ef4444" rx="2">
      <animate attributeName="width" values="35;55;35;45;35" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <text x="200" y="260" text-anchor="middle" fill="#f7f3ee" font-size="16" font-weight="600">StockAAssist</text>
  <text x="200" y="280" text-anchor="middle" fill="#94a3b8" font-size="12">AI 股票分析助手</text>
</svg>