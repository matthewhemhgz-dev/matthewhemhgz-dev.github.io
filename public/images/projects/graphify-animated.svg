<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="graphBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2823;stop-opacity:1" />
    </linearGradient>
    <filter id="graphGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#graphBg)" />
  
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="30" fill="#4ade80" opacity="0.2" filter="url(#graphGlow)">
      <animate attributeName="r" values="30;35;30" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#4ade80"/>
    
    <circle cx="60" cy="-20" r="6" fill="#fbbf24" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="-40" r="6" fill="#a7f3d0" opacity="0.8">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="50" r="6" fill="#fbbf24" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-60" cy="30" r="6" fill="#4ade80" opacity="0.8">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    
    <line x1="0" y1="8" x2="60" y2="-26" stroke="#4ade80" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="-8" x2="-50" y2="-46" stroke="#a7f3d0" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="8" x2="40" y2="44" stroke="#fbbf24" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="-8" x2="-60" y2="24" stroke="#4ade80" stroke-width="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="1.7s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <text x="200" y="260" text-anchor="middle" fill="#f7f3ee" font-size="16" font-weight="600">Graphify</text>
  <text x="200" y="280" text-anchor="middle" fill="#a8a29e" font-size="12">智能知识图谱构建</text>
</svg>