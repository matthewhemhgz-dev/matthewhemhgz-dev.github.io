<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="syncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="syncGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#syncBg)" />
  
  <g transform="translate(200, 150)">
    <rect x="-100" y="-60" width="70" height="50" fill="#6366f1" rx="6" opacity="0.8"/>
    <text x="-65" y="-35" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Notion</text>
    
    <rect x="30" y="-60" width="70" height="50" fill="#4ade80" rx="6" opacity="0.8"/>
    <text x="65" y="-35" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Obsidian</text>
    
    <rect x="-100" y="20" width="70" height="50" fill="#fbbf24" rx="6" opacity="0.8"/>
    <text x="-65" y="45" text-anchor="middle" fill="#1e1b18" font-size="10" font-weight="600">Google</text>
    
    <rect x="30" y="20" width="70" height="50" fill="#ef4444" rx="6" opacity="0.8"/>
    <text x="65" y="45" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Trello</text>
    
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <path d="M -30 -30 L 0 0" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <path d="M 30 -30 L 0 0" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <path d="M -30 30 L 0 0" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <path d="M 30 30 L 0 0" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="8" fill="#4ade80" filter="url(#syncGlow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="-45" cy="-15" r="3" fill="#ffffff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M -45 -15 L 0 0"/>
    </circle>
    <circle cx="45" cy="-15" r="3" fill="#ffffff">
      <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s" path="M 45 -15 L 0 0"/>
    </circle>
  </g>
  
  <text x="200" y="260" text-anchor="middle" fill="#f7f3ee" font-size="16" font-weight="600">Notion Sync</text>
  <text x="200" y="280" text-anchor="middle" fill="#94a3b8" font-size="12">跨平台数据同步</text>
</svg>