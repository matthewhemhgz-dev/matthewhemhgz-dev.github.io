<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e3dd;stop-opacity:1" />
    </linearGradient>
    <filter id="flowGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#flowBg)" />
  
  <g transform="translate(200, 150)">
    <rect x="-120" y="-80" width="80" height="40" fill="#4ade80" rx="6">
      <animate attributeName="opacity" values="1;0.8;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="-80" y="-58" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">开始</text>
    
    <rect x="0" y="-80" width="80" height="40" fill="#fbbf24" rx="6">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="-58" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">处理</text>
    
    <rect x="120" y="-80" width="80" height="40" fill="#3b82f6" rx="6">
      <animate attributeName="opacity" values="0.9;0.7;0.9" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="160" y="-58" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">结束</text>
    
    <path d="M -40 -60 L 0 -60" stroke="#1e1b18" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <path d="M 80 -60 L 120 -60" stroke="#1e1b18" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    
    <circle cx="-50" cy="-60" r="4" fill="#1e1b18">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M -40 -60 L 0 -60"/>
    </circle>
    <circle cx="90" cy="-60" r="4" fill="#1e1b18">
      <animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s" path="M 80 -60 L 120 -60"/>
    </circle>
    
    <rect x="-60" y="20" width="120" height="50" fill="#ffffff" stroke="#e8e3dd" stroke-width="1" rx="4"/>
    <rect x="-40" y="35" width="60" height="6" fill="#4ade80" rx="2">
      <animate attributeName="width" values="60;80;60" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-40" y="50" width="40" height="6" fill="#fbbf24" rx="2">
      <animate attributeName="width" values="40;70;40" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <text x="200" y="270" text-anchor="middle" fill="#1e1b18" font-size="16" font-weight="600">Flowy</text>
  <text x="200" y="288" text-anchor="middle" fill="#6b665f" font-size="12">低代码工作流平台</text>
</svg>